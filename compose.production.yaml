services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      APP_DATABASE_ROLE: ${APP_DATABASE_ROLE:-dayflow_app}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS}
      APP_AUTH_PROVIDER: ${APP_AUTH_PROVIDER:-supabase}
      APP_SUPABASE_URL: ${APP_SUPABASE_URL}
      APP_SUPABASE_PUBLISHABLE_KEY: ${APP_SUPABASE_PUBLISHABLE_KEY}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
